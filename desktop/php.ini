; PHP settings for the TDS School desktop build (extension_dir is passed by launch.ps1)
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 10M
post_max_size = 40M
max_input_vars = 5000
date.timezone = Asia/Kolkata
display_errors = Off
log_errors = On
variables_order = "EGPCS"

extension = curl
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
extension = openssl
extension = pdo_sqlite
extension = sqlite3
extension = sodium
extension = zip

zend_extension = opcache
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; CA certificates for HTTPS (SMS / WhatsApp gateways); path set by launch.ps1
