name: Build Windows installer

# Builds TDS-School-Setup.exe on a Windows machine.
# - Push a tag like v1.0.0  -> builds and publishes a GitHub Release (the website download link points to it).
# - "Run workflow" button, or a change to desktop/ on main -> builds a test installer (download it from the run's Artifacts).
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   TDS_LICENSE_PUBLIC_KEY  public key shown on your website's license admin page (required for releases)
#   TDS_VENDOR_PHONE, TDS_VENDOR_WHATSAPP, TDS_VENDOR_EMAIL, TDS_VENDOR_WEBSITE  shown on the License screen
#   TDS_TRIAL_DAYS          optional, default 30

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['desktop/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      LICENSE_PUBLIC_KEY: ${{ vars.TDS_LICENSE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release settings
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if (-not $env:LICENSE_PUBLIC_KEY) {
            Write-Error "Set the repository variable TDS_LICENSE_PUBLIC_KEY before publishing a release (see README -> Desktop app)."
            exit 1
          }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sqlite3, sodium, zip, opcache
          tools: composer
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Assemble program folder
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "VERSION=$version" >> $env:GITHUB_ENV

          # Laravel app (without tests, git, website, local data)
          robocopy . build\app /E /NFL /NDL /NJH /NJS /XD .git .github build dist desktop website tests node_modules storage /XF .env .env.* *.sqlite *.sqlite-journal phpunit.xml .phpunit.result.cache
          if ($LASTEXITCODE -ge 8) { exit 1 }
          foreach ($d in 'storage\app\private','storage\framework\cache\data','storage\framework\sessions','storage\framework\views','storage\logs') {
            New-Item -ItemType Directory -Force -Path "build\app\$d" | Out-Null
          }

          # Desktop .env
          $trial = if ('${{ vars.TDS_TRIAL_DAYS }}') { '${{ vars.TDS_TRIAL_DAYS }}' } else { '30' }
          (Get-Content desktop\env.desktop -Raw) `
            -replace '__VERSION__', $version `
            -replace '__LICENSE_PUBLIC_KEY__', $env:LICENSE_PUBLIC_KEY `
            -replace '__TRIAL_DAYS__', $trial `
            -replace '__VENDOR_PHONE__', '${{ vars.TDS_VENDOR_PHONE }}' `
            -replace '__VENDOR_WHATSAPP__', '${{ vars.TDS_VENDOR_WHATSAPP }}' `
            -replace '__VENDOR_EMAIL__', '${{ vars.TDS_VENDOR_EMAIL }}' `
            -replace '__VENDOR_WEBSITE__', '${{ vars.TDS_VENDOR_WEBSITE }}' |
            Set-Content build\app\.env -NoNewline

          # Portable PHP
          $phpDir = Split-Path (Get-Command php).Source
          Copy-Item $phpDir build\php -Recurse
          Remove-Item build\php\php.ini* -Force -ErrorAction SilentlyContinue
          Copy-Item desktop\php.ini build\php\php.ini
          Invoke-WebRequest https://curl.se/ca/cacert.pem -OutFile build\php\cacert.pem

          # Launcher
          Copy-Item desktop\launch.ps1, desktop\launch.vbs, desktop\stop.ps1, desktop\stop.vbs, desktop\app.ico build\

          # Drop debug symbols / dev files that are not needed to run PHP
          Get-ChildItem build\php -Recurse -Include *.pdb, *.lib | Remove-Item -Force -ErrorAction SilentlyContinue
          foreach ($d in 'build\php\dev', 'build\php\extras') { if (Test-Path $d) { Remove-Item $d -Recurse -Force } }
          foreach ($d in 'build\app', 'build\app\vendor', 'build\php') {
            "{0,-20} {1,6:N0} MB" -f $d, ((Get-ChildItem $d -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          }
          exit 0  # robocopy leaves exit code 1 ("files copied"), which is success

      - name: Smoke test (start the app like a school would)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'tds-data'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\launch.ps1 -NoBrowser -DataDir $data
          if ($LASTEXITCODE -ne 0) { Get-Content "$data\storage\logs\*.log" -ErrorAction SilentlyContinue; exit 1 }
          $port = (Get-Content "$data\port.txt" -Raw).Trim()
          $r = Invoke-WebRequest "http://127.0.0.1:$port/setup" -UseBasicParsing
          if ($r.StatusCode -ne 200 -or $r.Content -notmatch 'TDS School Management Software') { Write-Error 'Setup page did not load'; exit 1 }
          # second launch must reuse the running server
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\launch.ps1 -NoBrowser -DataDir $data
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "OK: app answered on port $port"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\stop.ps1
          Remove-Item "build\app\storage\logs\*" -Force -ErrorAction SilentlyContinue
          Remove-Item 'HKCU:\Software\TDS School Management' -Recurse -ErrorAction SilentlyContinue

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$PWD\build" "/DOutputDir=$PWD\dist" desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\TDS-School-Setup.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: TDS-School-Setup-${{ env.VERSION }}
          path: dist/TDS-School-Setup.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: TDS School Management Software ${{ env.VERSION }}
          files: dist/TDS-School-Setup.exe
          body: |
            Download **TDS-School-Setup.exe**, run it and follow the steps.
            If Windows shows "Windows protected your PC", click **More info → Run anyway**.
            Updating: just install the new version over the old one. Your school data is kept.
